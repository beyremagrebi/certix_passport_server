
events {}

http {
    server {
        listen 80;

        # User Service - Available
        location /api/users/ {
            proxy_pass http://host.docker.internal:8001/;
        }

        # Achievements Service - Not ready yet
        location /api/achievements/ {
            return 503 "Achievements Service is not available yet";
        }

        # Events Service - Not ready yet
        location /api/events/ {
            return 503 "Events Service is not available yet";
        }

        # Passport Service - Not ready yet
        location /api/passport/ {
            return 503 "Passport Service is not available yet";
        }

        location / {
            default_type text/plain;
            return 200 "Certix Passport API Gateway is running!";
        }
    }
}
