[project]
name = "user-service"
version = "0.1.0"
description = ""
authors = [
    {name = "beyrem agrebi",email = "beyremagrebi58@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary] (>=3.3.6,<4.0.0) ; python_version >= \"3.14\" and python_version < \"4.0\"",
    "fastapi (>=0.146.0,<0.147.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[project.scripts]
dev = "app.starter:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


