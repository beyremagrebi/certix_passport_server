[project]
name = "user-service"
version = "0.1.0"
description = ""
authors = [
    { name = "beyrem agrebi", email = "beyremagrebi58@gmail.com" }
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "flask-jwt-extended (>=4.7.4,<5.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
]

[tool.poetry]
packages = [{ include = "app", from = "src" }]

[project.scripts]
user-service = "app.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


